<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="{{ site.google_site_verification }}" />
    <link rel="icon" type="image/png" sizes="512x512" href="{{ '/favicon.png' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/favicon.png' | relative_url }}">
    {% if page.url == "/404.html" %}
        <meta http-equiv="refresh" content="5; url=/">
    {% endif %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">

    {% seo %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="container header-inner">
            <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author }}</a>
            <nav class="site-nav" aria-label="Main">
                {% for x in site.nav %}
                    <a href="{{ x.link | relative_url }}"
                       {% if x.external %}target="_blank" rel="noopener"{% endif %}
                       {% if page.nav == x.id %}class="is-active" aria-current="page"{% endif %}>{{ x.name }}</a>
                {% endfor %}
            </nav>
        </div>
    </header>

    <main id="main" class="container">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-name">{{ site.author }}</p>
            <p class="footer-credit">
                &copy; {{ site.time | date: "%Y" }} &middot;
                <a href="{{ site.footer_credit_url }}" target="_blank" rel="noopener">{{ site.footer_credit_text }}</a>
            </p>
        </div>
    </footer>

    {% if site.tracking_id %}
        <script>
          (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
          (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
          m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
          })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
          ga('create', '{{ site.tracking_id }}', 'auto');
          ga('send', 'pageview');
        </script>
    {% endif %}
</body>
</html>
